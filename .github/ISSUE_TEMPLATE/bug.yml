name: Bug report
description: Something in Lanternist fails or does the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. A question about installing, or about how to do something, goes to Discussions, category **Installation**, and many answers are already in the FAQ, `docs/faq.md`.

        **Before you paste anything, remove your keys, your tokens and anything personal**: your Windows user name in a path, your channel id or your email. Never paste your `.env`.
  - type: input
    id: commit
    attributes:
      label: Lanternist commit
      description: Run `git rev-parse --short HEAD` in your Lanternist folder.
      placeholder: a1b2c3d
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card, VRAM and driver
      description: Run `nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader` and paste the line.
      placeholder: NVIDIA GeForce RTX 3060 Ti, 8192 MiB, 580.97
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where it failed
      options:
        - Installing (instala.py)
        - Creating a channel
        - The script or the slides
        - The images (ComfyUI)
        - The voice
        - The scene or the render
        - The AI marks or the detector
        - The upload to YouTube
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: The command you ran, or what you asked Claude Code, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The full error message
      description: Paste it as text, not as a screenshot. If `.venv\Scripts\python pipeline.py --check` or `py -3.12 instala.py --comprueba` says something is missing, paste that too.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: Privacy
      options:
        - label: I removed my keys, tokens, user name, channel id and email from what I pasted.
          required: true
